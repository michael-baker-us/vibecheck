boundaries:
  - name: ui-does-not-read-repository-directly
    from: src/ui/**
    cannot_import:
      - src/collectors/**
      - src/config/**
      - src/verification/**

  - name: domain-remains-independent
    from: src/domain/**
    cannot_import:
      - src/adapters/**
      - src/analyzers/**
      - src/collectors/**
      - src/config/**
      - src/ui/**
      - src/verification/**
