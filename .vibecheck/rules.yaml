boundaries:
  - name: ui-does-not-read-repository-directly
    from: vibecheck/src/ui/**
    cannot_import:
      - vibecheck/src/collectors/**
      - vibecheck/src/config/**
      - vibecheck/src/verification/**

  - name: domain-remains-independent
    from: vibecheck/src/domain/**
    cannot_import:
      - vibecheck/src/adapters/**
      - vibecheck/src/analyzers/**
      - vibecheck/src/collectors/**
      - vibecheck/src/config/**
      - vibecheck/src/ui/**
      - vibecheck/src/verification/**
