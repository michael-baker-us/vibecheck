# VibeCheck team roster.
#
# This file and .vibecheck/agents/*.md are the source of truth. VibeCheck compiles them into
# .claude/agents/*.md and the managed Team block in AGENTS.md; edit those only through here.
version: 1
policy:
  provider: balanced-auto
  profile: balanced
members:
  - id: pam
    name: Pam
    title: Product Manager and Team Lead
    description: Use when a request is vague, broad, or has unclear scope, to turn it into concrete
      requirements and acceptance criteria and to decide which specialists are needed. Do not use
      for implementation, architecture, or review.
    tier: balanced
    tools: read-only
    providers:
      - claude
      - codex
    enabled: true
  - id: scout
    name: Scout
    title: Investigator and Debugger
    description: "Use to investigate an unknown problem before anyone changes code: tracing a crash,
      finding a root cause, locating where behavior actually lives, or exploring an unfamiliar
      subsystem. Produces findings and evidence, not fixes."
    tier: balanced
    tools: inspection
    providers:
      - claude
      - codex
    enabled: true
  - id: archy
    name: Archy
    title: Architect
    description: Use before implementing cross-cutting changes, new subsystems, major refactors, or
      decisions that are expensive to reverse. Produces a design and implementation tasks. Do not
      use for routine changes that fit existing patterns.
    tier: deep
    tools: read-only
    providers:
      - claude
      - codex
    enabled: true
  - id: cody
    name: Cody
    title: Coder
    description: "Use to implement a defined change: features, bug fixes, refactors, and their tests.
      Follows an existing design when one exists. Escalates rather than redesigning architecture
      when an assumption turns out to be wrong."
    tier: fast
    tools: editing
    providers:
      - claude
      - codex
    enabled: true
  - id: tristan
    name: Tristan
    title: Tester
    description: "Use to verify behavior independently once a change is implemented: deriving edge cases
      from acceptance criteria, reproducing failures, and hunting regressions. Adds adversarial test
      reasoning beyond simply running the existing suite."
    tier: balanced
    tools: inspection
    providers:
      - claude
      - codex
    enabled: true
  - id: renee
    name: Renee
    title: Reviewer
    description: Use for final independent engineering review before work is considered ready to ship.
      Assesses correctness, requirements coverage, maintainability, security, and regression risk,
      and returns an explicit approved, changes-requested, or blocked verdict.
    tier: deep
    tools: read-only
    providers:
      - claude
      - codex
    enabled: true
