plans:
  include:
    - PLAN.md
    - plans/**/*.md
    - docs/**/*plan*.md
  active: PLAN.md

verification:
  - name: typecheck
    category: quality
    required: true
    command: npm run check
    invalidated_by:
      - src/**
      - tsconfig.json
      - package.json
      - package-lock.json

  - name: tests
    category: tests
    required: true
    command: npm run test
    invalidated_by:
      - src/**
      - test/**
      - resources/**
      - tsconfig.json
      - package.json
      - package-lock.json

  - name: core coverage
    category: coverage
    required: true
    command: npm run coverage
    invalidated_by:
      - src/**
      - test/**
      - resources/**
      - tsconfig.json
      - package.json
      - package-lock.json

  - name: dependency security
    category: security
    required: true
    command: npm run security
    invalidated_by:
      - package.json
      - package-lock.json

diff_expansion_threshold: 15
