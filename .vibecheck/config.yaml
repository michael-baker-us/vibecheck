plans:
  include:
    - vibecheck/PLAN.md
    - vibecheck/plans/**/*.md
    - vibecheck/docs/**/*plan*.md
  active: vibecheck/PLAN.md

verification:
  - name: typecheck
    category: quality
    required: true
    command: npm --prefix vibecheck run check
    invalidated_by:
      - vibecheck/src/**
      - vibecheck/tsconfig.json
      - vibecheck/package.json
      - vibecheck/package-lock.json

  - name: tests
    category: tests
    required: true
    command: npm --prefix vibecheck run test
    invalidated_by:
      - vibecheck/src/**
      - vibecheck/test/**
      - vibecheck/resources/**
      - vibecheck/tsconfig.json
      - vibecheck/package.json
      - vibecheck/package-lock.json

  - name: core coverage
    category: coverage
    required: true
    command: npm --prefix vibecheck run coverage
    invalidated_by:
      - vibecheck/src/**
      - vibecheck/test/**
      - vibecheck/resources/**
      - vibecheck/tsconfig.json
      - vibecheck/package.json
      - vibecheck/package-lock.json

  - name: dependency security
    category: security
    required: true
    command: npm --prefix vibecheck run security
    invalidated_by:
      - vibecheck/package.json
      - vibecheck/package-lock.json

diff_expansion_threshold: 15
